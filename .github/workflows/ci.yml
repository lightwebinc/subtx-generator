name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@fcb564d49f07d6002441feb9d97ae3ce561e0f17 # v0.6.2

